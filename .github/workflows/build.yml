name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew
      - run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duskwalker-build
          path: |
            build/libs/*.jar
            build.log
      - name: Publish jar (dist/ + release)
        if: success()
        run: |
          mkdir -p dist
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          cp "$JAR" dist/duskwalker-horror.jar
          git config user.name github-actions
          git config user.email actions@github.com
          git add -f dist/duskwalker-horror.jar
          git commit -m "build: jar [skip ci]" || true
          git push || true
          gh release delete latest -y --cleanup-tag || true
          gh release create latest dist/duskwalker-horror.jar --title "Duskwalker Horror (jar)" --notes "Fabric 1.21.1 jar" 
        env:
          GH_TOKEN: ${{ github.token }}
