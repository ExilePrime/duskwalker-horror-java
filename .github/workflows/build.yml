name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew
      - run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duskwalker-build
          path: |
            build/libs/*.jar
            build.log
